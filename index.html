<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NEOSUPO★STAR β7</title>
  <link rel="stylesheet" href="css/app.css?v=20261111t" />
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three/build/three.module.js",
      "three/addons/": "./vendor/three/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <aside class="rail" aria-label="作業の切り替え">
    <nav class="tabs">
      <button type="button" data-tab="layout" class="active" title="間取設定">間取</button>
      <button type="button" data-tab="items" title="アイテム配置">配置</button>
      <button type="button" data-tab="power" title="配電管理">配電</button>
      <button type="button" data-tab="env" title="環境計画">環境</button>
      <button type="button" data-tab="present" title="報告の設定">報告</button>
    </nav>
    <button id="help" type="button" class="rail-help" title="操作説明">ヘルプ</button>
  </aside>
  <header class="top">
    <div class="brand">
      <span class="product">NEOSUPO STAR <small>β7</small></span>
    </div>
    <label class="plan-field">プラン
      <input id="plan-name" type="text" aria-label="プラン名" />
    </label>
    <button id="detail" type="button">プラン詳細</button>
    <button id="plan-list" type="button">プラン一覧</button>
    <span class="spacer"></span>
    <button id="import-excel" type="button">Excel読込</button>
    <button id="export-excel" type="button">Excel書出</button>
    <button id="new-plan" type="button">＋ 新しいプラン</button>
    <input id="excel-file" type="file" accept=".xlsx,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" hidden />
  </header>
  <div class="workspace specs-folded">
    <div id="menu-panel">
      <button type="button" id="fold-menu" class="fold" aria-expanded="true" aria-controls="sidebar">パネルを閉じる</button>
      <aside id="sidebar"></aside>
    </div>
    <main>
      <div class="stage">
        <canvas id="view2d"></canvas>
        <canvas id="view3d" hidden></canvas>
        <canvas id="walk-map" width="200" height="150" hidden aria-label="歩行中の平面図" title="クリックした場所へ移動"></canvas>
        <div class="float-tools" id="float-tools">
          <button type="button" id="fold-tools" class="fold" aria-expanded="true" aria-controls="float-body">閉じる</button>
          <div id="float-body">
            <div class="tool-group">
              <button type="button" id="mode-2d" class="active">DRAW</button>
              <button type="button" id="mode-3d">3D</button>
            </div>
            <div class="tool-group" id="view-toggle" hidden>
              <button type="button" id="sky" class="active">Sky</button>
              <button type="button" id="walk">Walk</button>
              <button type="button" id="doors" aria-pressed="true">ドアを閉じる</button>
            </div>
            <div class="tool-group">
              <button type="button" id="fit">全体表示</button>
              <button type="button" id="zoom-out">縮小</button>
              <button type="button" id="zoom-in">拡大</button>
            </div>
            <div class="tool-group">
              <button type="button" id="undo">元に戻す</button>
              <button type="button" id="redo">やり直す</button>
              <label class="check"><input id="snap" type="checkbox" checked /> スナップ</label>
            </div>
          </div>
        </div>
      </div>
    </main>
    <aside id="specs-panel">
      <button type="button" id="fold-specs" class="fold" aria-expanded="false" aria-controls="specs-body">諸元一覧</button>
      <div id="specs-body"></div>
    </aside>
  </div>

  <dialog id="dialog-new">
    <form method="dialog" id="form-new">
      <h2>新規プラン</h2>
      <label>天井高 mm<input name="ceiling" type="number" value="2700" min="2000" max="8000" /></label>
      <label>階高 mm<input name="floorHeight" type="number" value="4000" min="2000" max="12000" /></label>
      <label>壁厚 mm<input name="wall" type="number" value="150" min="50" max="400" /></label>
      <div class="row">
        <button value="cancel" type="button" id="new-cancel">キャンセル</button>
        <button value="ok" type="submit" class="primary">作成</button>
      </div>
    </form>
  </dialog>

  <dialog id="dialog-list" class="thumbs">
    <form method="dialog">
      <h2>プラン一覧</h2>
      <div class="plan-list-bar">
        <label>表示件数
          <input id="plan-page-size" type="number" min="1" max="60" step="1" value="10" inputmode="numeric" />
        </label>
        <div class="plan-view-switch" role="group" aria-label="表示の切り替え">
          <button type="button" id="plan-view-list" aria-pressed="false">一覧</button>
          <button type="button" id="plan-view-thumb" class="active" aria-pressed="true">サムネイル</button>
        </div>
      </div>
      <div id="plan-rows"></div>
      <nav id="plan-pager" class="plan-pager" aria-label="ページ"></nav>
      <button id="plan-list-close" value="close" type="submit">閉じる</button>
    </form>
  </dialog>

  <dialog id="dialog-detail">
    <form method="dialog">
      <h2>プラン詳細</h2>
      <div id="detail-body"></div>
      <div class="row">
        <button type="button" id="detail-columns">表示設定</button>
        <button type="button" id="print">印刷</button>
        <button value="close" type="submit">閉じる</button>
      </div>
    </form>
  </dialog>

  <dialog id="dialog-detail-columns">
    <form method="dialog">
      <h2>表示項目</h2>
      <div id="detail-column-list" class="detail-columns"></div>
      <button value="close" type="submit">閉じる</button>
    </form>
  </dialog>

  <dialog id="dialog-help">
    <form method="dialog">
      <h2>操作</h2>
      <button value="close" type="submit">閉じる</button>
    </form>
  </dialog>

  <div id="print-sheet"></div>
  <script src="vendor/jszip.min.js?v=20261022w"></script>
  <script src="vendor/exceljs.min.js?v=20261022w"></script>
  <script type="module" src="main.js?v=20261111t"></script>
</body>
</html>
